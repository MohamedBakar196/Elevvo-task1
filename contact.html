<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us</title>
  <link rel="stylesheet" href="./css/contact.css" />
  <script src="https://kit.fontawesome.com/a2b5d5f6d7.js" crossorigin="anonymous"></script>
</head>

<body>
  <!-- Contact Form Page -->
  <main class="contact-container">
    <div class="contact-card">
      <h1>Contact Us</h1>
      <p class="subtitle">We’d love to hear from you. Please fill out the form below.</p>

      <form id="contactForm" novalidate>
        <div class="form-grid">
          <div class="form-group">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" name="fullName" placeholder="John Doe" required>
            <span class="error-msg" id="nameError" role="alert"></span>
          </div>

          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="john@example.com" required>
            <span class="error-msg" id="emailError" role="alert"></span>
          </div>
        </div>

        <div class="form-group">
          <label for="subject">Subject</label>
          <input type="text" id="subject" name="subject" placeholder="Subject" required>
          <span class="error-msg" id="subjectError" role="alert"></span>
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" placeholder="Write your message..." required></textarea>
          <span class="error-msg" id="messageError" role="alert"></span>
        </div>

        <button type="submit" class="btn-submit">Send Message</button>
      </form>

      <!-- Back link to Sidebar page -->
      <p class="back-link">
        <a href="./index.html"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</a>
      </p>

      <div class="toast success-toast" id="successToast" role="alert" aria-live="polite">
        <i class="fa-solid fa-circle-check"></i> Message sent successfully!
      </div>
    </div>
  </main>

  <script src="./js/contact.js"></script>
</body>

</html>
